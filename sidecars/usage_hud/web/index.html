<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Host bridge: exposes window.sidecar (token, conversationId, fetch) and
     synchronizes host theme CSS variables (--background, --foreground, --card, ...)
     onto :root. -->
<script src="/preload.js"></script>
<title>Usage</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/scrollbars.css">
<script>
  // Boot watchdog: if app.js fails to load or start, surface the error rather
  // than hanging on "Loading…" indefinitely. Uses ES5 syntax intentionally.
  window.__usageBootErrors = [];
  window.addEventListener('error', function (e) {
    var msg = (e && (e.message || (e.error && e.error.message))) || 'failed to load script';
    window.__usageBootErrors.push(String(msg));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e && e.reason;
    window.__usageBootErrors.push(String((reason && reason.message) || reason || 'unhandled rejection'));
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || !root.querySelector('.boot')) return;
      var why = window.__usageBootErrors[0] || 'app.js did not start';
      root.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'empty';
      box.textContent = 'Failed to start: ' + why;
      root.appendChild(box);
    }, 4000);
  });
</script>
</head>
<body>
<div id="scroller" class="ag-scroll">
  <div id="root"><div class="boot">Loading…</div></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
